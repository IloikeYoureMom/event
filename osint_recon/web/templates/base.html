<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}osint recon{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark"></span>
    <span class="brand-name">OSINT&nbsp;RECON</span>
  </a>
  <nav class="nav">
    <a href="/" class="nav-item {{ 'active' if active == 'events' and not selected }}">Dashboard</a>
    <a href="/events" class="nav-item {{ 'active' if active == 'events' and selected }}">Events</a>
    <a href="/sources" class="nav-item {{ 'active' if active == 'sources' }}">Sources</a>
    <a href="/settings" class="nav-item {{ 'active' if active == 'settings' }}">Settings</a>
  </nav>
  <form class="topsearch" method="get" action="/search">
    <input type="search" name="q" placeholder="search values, tags, attributes..." value="{{ args.get('q', '') }}" autofocus>
  </form>
  <div class="jobbox">
    <button id="trigger-btn" class="btn-run">RUN</button>
    <span id="trigger-status" class="muted small"></span>
  </div>
</header>
<div class="page">
  {% block content %}{% endblock %}
</div>
<input type="hidden" id="last-run" value="{{ runs[0].run if runs else '' }}">
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
