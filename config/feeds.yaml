http:
  user_agent: osint-recon/0.1 (threat-intel research tool; contact=intel-team@yourorg.example)
  respect_robots: true
  min_delay_seconds: 2.0
  timeout_seconds: 30
  retries: 2
watch_terms:
- yourcompany
- yourbrand.com
output:
  data_dir: data
sources:
  openphish_feeds:
    enabled: true
  urlhaus_dump:
    enabled: true
  phishtank_urls:
    enabled: true
    limit: 2000
  emerging_compromised:
    enabled: true
  threatfox_csv:
    enabled: true
  exploitdb_cves:
    enabled: true
  sslbl_fingerprints:
    enabled: true
  ransomware_live_profiles:
    enabled: true
  hosts_blocklists:
    enabled: true
    max_items: 5000
  tor_relays:
    enabled: true
    flagged_only: false
  text_feeds:
    enabled: true
    feeds: {}
  stix_files:
    enabled: true
    urls:
    - https://raw.githubusercontent.com/digitalside/threat-actor/master/latest.tar.gz
    paths: []
  rss_reports:
    enabled: true
    feeds: {}
    filter_keywords: []
  sec_8k_item105:
    enabled: false
    lookback_days: 7
    fetch_item_text: false
    max_items: 60
  github_repos:
    enabled: false
    queries: []
    since: ''
  github_ioc_repos:
    enabled: true
    repos:
    - digitalside/threat-actor
    - brianklaas/Threat-Actor-Name-Database
    - centerforsecurityanddemocracy/public_threat_lists
  github_secrets:
    enabled: false
    use_code_search: false
    max_repos: 25
    max_files_per_repo: 40
    queries: []
    repos:
    - gitleaks/gitleaks
    - tleyden/keynuker
  crtsh_certs:
    enabled: false
    domains:
    - abuse.ch
    - urlhaus.abuse.ch
    since_id: 0
  ransom_leaks:
    enabled: false
    watchlist: []
  hibp_domain:
    enabled: false
    api_key: ''
    domains: []
  malwarebazaar_brand:
    enabled: false
    search_terms:
    - stealer
    - redline
    - vidar
  telegram:
    enabled: false
    channels: []
    keywords:
    - breach
    - stealer
    - combo
    history_limit: 200
  discord:
    enabled: false
    channel_ids: {}
  forums:
    enabled: false
    sites: []
  paste_dumps:
    enabled: false
    dump_urls: []
    watch_terms:
    - yourbrand.com
  leak_teasers:
    enabled: false
    url: ''
    token: ''
  doc_links:
    enabled: false
    seed_urls: []
    allowed_hosts: []
    follow_links: false
    max_docs: 25
  rentry_search:
    enabled: true
    watch_terms:
    - breach
    - combo
    - stealer
    - db
  telegram_web:
    enabled: true
    channels:
    - vxunderground
    - durov
    keywords:
    - breach
    - stealer
    - db
    - combo
    - panel
    - log
    - sale
    filter_by_keywords: false
    pages: 1
    delay_seconds: 2.0
    discover_channels: true
    max_discovered: 5
  discord_public:
    enabled: true
    invite_codes:
    - discord
    - dfYQ4VGnqZ
    crawl_pages: 1
    max_invites: 40
    delay_seconds: 1.5
